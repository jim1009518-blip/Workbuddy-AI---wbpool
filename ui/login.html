<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="./">
<title>WB Pool · 登录</title>
<style>
  :root {
    --bg: #080b10;
    --panel: #0f151c;
    --line: #1e2833;
    --text: #e6edf3;
    --dim: #8b98a5;
    --dimmer: #5b6773;
    --green: #3ddc97;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(61,220,151,.10), transparent 60%),
      radial-gradient(700px 400px at 80% 100%, rgba(74,168,255,.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: 320px;
    background: linear-gradient(180deg, #141b24, #0f151c);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px 26px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #3ddc97, #2a9d8f 55%, #4aa8ff);
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: #061014;
    box-shadow: 0 6px 22px rgba(61,220,151,.25);
  }
  h1 { font-size: 16px; text-align: center; margin: 0 0 4px; font-weight: 650; letter-spacing: .3px; }
  p.hint { text-align: center; font-size: 12px; color: var(--dim); margin: 0 0 22px; }
  label { display: block; font-size: 11.5px; color: var(--dim); margin-bottom: 7px; letter-spacing: .3px; }
  input {
    width: 100%; padding: 11px 13px; font: inherit; font-size: 15px;
    letter-spacing: 3px;
    background: #0a1017; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    outline: none; transition: .16s;
  }
  input:focus { border-color: #2fa87a; box-shadow: 0 0 0 3px rgba(61,220,151,.12); }
  button {
    width: 100%; margin-top: 16px; padding: 11px;
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    color: #eafff7; background: linear-gradient(135deg, #2fa87a, #1f7d5c);
    border: 1px solid #2fa87a; border-radius: 10px; transition: .16s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .err { color: var(--red); font-size: 12px; text-align: center; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">WB</div>
  <h1>WB Pool</h1>
  <p class="hint">输入访问密码</p>
  <form id="f">
    <label for="p">密码</label>
    <input id="p" type="password" autocomplete="current-password" autofocus inputmode="numeric">
    <button id="b" type="submit">进入</button>
  </form>
  <div class="err" id="e"></div>
</div>
<script>
  // 已经登录过就直接进控制台
  fetch('api/status', { cache: 'no-store' })
    .then((r) => { if (r.ok) location.replace('./') })
    .catch(() => {})

  const f = document.getElementById('f')
  const input = document.getElementById('p')
  const btn = document.getElementById('b')
  const err = document.getElementById('e')

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault()
    const password = input.value.trim()
    if (!password) return
    btn.disabled = true
    err.textContent = ''
    try {
      const res = await fetch('api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      })
      if (res.ok) {
        location.replace('./')
        return
      }
      const d = await res.json().catch(() => ({}))
      err.textContent = d.error || '密码不对'
      input.select()
    } catch (e) {
      err.textContent = '连不上服务'
    } finally {
      btn.disabled = false
    }
  })
</script>
</body>
</html>
